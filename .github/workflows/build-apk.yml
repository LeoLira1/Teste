name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/flutter-product-location-test-8xd35n'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0) — leave empty to skip release'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project files
        run: ./tool/ensure_android_project.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-prateleiras-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ── Resolve release tag ───────────────────────────────────────────────
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.version }}" != "" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/master || "$GITHUB_REF" == "refs/heads/claude/flutter-product-location-test-8xd35n" ]]; then
            echo "value=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.tag.outputs.value != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Mapa de Prateleiras ${{ steps.tag.outputs.value }}
          body: |
            ## Mapa de Prateleiras

            APK de release gerado automaticamente.

            ### Instalação
            1. Baixe o arquivo `mapa-prateleiras.apk`
            2. Habilite **Fontes desconhecidas** nas configurações do Android
            3. Abra o arquivo para instalar
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
