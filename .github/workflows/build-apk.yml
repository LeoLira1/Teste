name: Build APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0) — leave empty to skip release'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project files
        run: ./tool/ensure_android_project.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-prateleiras-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ── GitHub Release ────────────────────────────────────────────────────
      # Runs when the commit is tagged (v*) OR when manually triggered with a version.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          name: Mapa de Prateleiras ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          body: |
            ## Mapa de Prateleiras

            APK de release gerado automaticamente.

            ### Instalação
            1. Baixe o arquivo `mapa-prateleiras.apk`
            2. Habilite "Fontes desconhecidas" nas configurações do Android
            3. Abra o arquivo para instalar
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
